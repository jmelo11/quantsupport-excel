[workspace]
members = [".", "macros"]
resolver = "2"

[workspace.package]
version = "0.1.25"
rust-version = "1.100"

[package]
name = "quantsupport-xll"
version.workspace = true
rust-version.workspace = true
edition = "2021"
description = "Excel XLL bindings for QuantSupport"
license = "MIT"
repository = "https://github.com/jmelo11/quantsupport-excel"
publish = false
exclude = ["AGENTS.md", "**/AGENTS.md", ".editorconfig", "ruff.toml", ".ruff.toml", "rustfmt.toml", ".rustfmt.toml", "requirements-dev.txt", "Directory.Build.props", "PSScriptAnalyzerSettings.psd1"]

[[example]]
name = "function_catalog"
path = "tools/function_catalog.rs"

[[example]]
name = "validate_example_market"
path = "tools/validate_example_market.rs"

[[example]]
name = "benchmark_history"
path = "tools/benchmark_history.rs"

[lib]
name = "quantsupport_xll"
crate-type = ["cdylib", "rlib"]

[dependencies]
quantsupport = { git = "https://github.com/jmelo11/quantsupport", rev = "251abc5e71aff7b979929c6b7f4ef821ef22c7e9" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.7"

[target.'cfg(windows)'.dependencies]
xll-rs = "0.1.1"
xllgen = "0.1.2"
quantsupport-xll-macros = { path = "macros" }
windows = { version = "0.61", features = ["Win32_Security", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[dev-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[build-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
serde_json = "1.0"

[profile.test]
opt-level = 2
