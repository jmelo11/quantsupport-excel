name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Binding commit to build and test
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Portable native contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test native contracts
        run: cargo +stable test --locked --workspace --all-targets

  excel:
    name: Windows 64-bit XLL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test worksheet functions and registry
        run: cargo +stable test --locked -p quantsupport-xll --lib --example function_catalog
      - name: Test ribbon JSON contract
        run: dotnet run --project ribbon/tests/ContractTests.csproj --configuration Release
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release and download tools
        run: |
          python -m unittest discover -s tools/tests -p test_release.py -v
          python -m unittest discover -s tools/tests -p test_excel_downloads.py -v
      - name: Test generated Excel workbooks against the function catalog
        run: |
          python -m pip install -r examples/requirements.txt
          python -m unittest discover -s examples/tests -p 'test_*.py' -v
      - name: Build and package XLL
        shell: pwsh
        run: ./tools/excel/build.ps1 -Profile release
      - uses: actions/upload-artifact@v6
        with:
          name: excel-windows-x64
          path: |
            dist/quantsupport.xll
            dist/quantsupport.intellisense.xml
            dist/ExcelDna.IntelliSense64.xll
            dist/QuantSupport.Ribbon64.xll
            dist/quantsupport-excel-windows-x64.zip
          if-no-files-found: error
